<!DOCTYPE html>
<html lang="en">
<head>
    <title>Play Tic Tac Toe Online</title>
    <meta charset="utf-8">
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <link rel="stylesheet" type="text/css" href="./css/game.css">
</head>

<body id='body'>
    <h1>Tic Tac Toe Game</h1>
    <!--This container is needed to overlay our canvas over our table-->
    <div class='center-container'>
        <!--Note:Canvas width and height must be within the element.-->
        <canvas id ='win-lines' width='608' height='608'></canvas>
        <table>
            <tr>
                <td id='0' onclick='placeABrB("0")'></td>
                <td id='1' onclick='placeABrB("1")'></td>
                <td id='2' onclick='placeABrB("2")'></td>   
            </tr>
            <tr>
                <td id='3' onclick='placeABrB("3")'></td>
                <td id='4' onclick='placeABrB("4")'></td>
                <td id='5' onclick='placeABrB("5")'></td>
            </tr>
            <tr>
                <td id='6' onclick='placeABrB("6")'></td>
                <td id='7' onclick='placeABrB("7")'></td>
                <td id='8' onclick='placeABrB("8")'></td>
            </tr>
            <script src ="js/tictactoe.js"></script>
        </table>
    </div>
</body>
</html>
